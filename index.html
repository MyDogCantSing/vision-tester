<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Viewfinder: Dynamic Bottom-Anchored Tester</title>

  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column; /* Stacks controls top, viewfinder fills remaining bottom */
    }

    /* High-Visibility Readout Banner */
    #photo-readout {
      background-color: #ffff00;
      color: #000000;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 900;
      border-bottom: 2px solid #ffffff;
      z-index: 300;
    }

    #readout-values { display: flex; gap: 8px; flex-wrap: wrap; }

    #btn-group { display: flex; gap: 6px; align-items: center; }

    #exitBtn {
      background: #ff3b30; color: #ffffff;
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }

    /* WebRTC Call Connection Bar */
    #connection-bar {
      background-color: #1c1c1e;
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      font-size: 13px;
    }

    #peer-id-display { color: #30d158; font-weight: bold; }
    #call-input {
      background: #2c2c2e; color: #fff; border: 1px solid #444;
      padding: 4px 8px; border-radius: 6px; width: 110px; text-transform: lowercase;
    }
    #call-btn {
      background: #0a84ff; color: #fff; border: none;
      padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    #top-bar {
      position: relative;
      width: 100%;
      background-color: rgba(0,0,0,0.95);
      z-index: 200;
      display: flex;
      flex-direction: column;
      flex: 0 0 auto; /* Takes only as much height as controls require */
    }

    #controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
      padding: 8px 3%;
      width: 100%;
    }

    .full-width { grid-column: span 2; }
    .control-group { display: flex; flex-direction: column; gap: 2px; }
    .label-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #ccc; }
    .slider-val { color: #0a84ff; font-size: 13px; font-weight: bold; }

    .input-row { display: flex; align-items: center; gap: 6px; }

    .step-btn {
      background-color: #2c2c2e; color: #0a84ff;
      border: 1px solid #444; border-radius: 6px;
      width: 40px; height: 34px; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; flex-shrink: 0;
    }
    .step-btn:active { background-color: #0a84ff; color: #ffffff; }

    input[type=range] { flex: 1; height: 32px; accent-color: #0a84ff; cursor: pointer; }

    /* Viewfinder Area: Fills 100% of remaining vertical screen space down to the bottom */
    #viewfinder-container {
      position: relative;
      flex: 1; 
      width: 100%;
      background-color: #000000;
      border-top: 1px solid #333333;
      overflow: hidden;
      z-index: 10;
      display: flex;
      align-items: flex-end; /* Pins frame to absolute bottom */
      justify-content: center;
    }

    #aperture-wrapper {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden; display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform-origin: center bottom; /* Zoom scales relative to the floor */
    }

    #center-cross {
      width: 24px; height: 24px; position: absolute; pointer-events: none; z-index: 30;
      bottom: 10px;
    }
    #center-cross::before, #center-cross::after {
      content: ''; position: absolute; background-color: rgba(255,255,255,0.6);
    }
    #center-cross::before { left: 11px; top: 0; width: 2px; height: 100%; }
    #center-cross::after { left: 0; top: 11px; width: 100%; height: 2px; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="photo-readout">
      <div id="readout-values">
        <span>TOP: <span id="summaryTop">0</span>%</span>
        <span>BTM: <span id="summaryBottom">0</span>%</span>
        <span>LFT: <span id="summaryLeft">0</span>%</span>
        <span>RGT: <span id="summaryRight">0</span>%</span>
        <span>ZOOM: <span id="summaryZoom">1.0</span>x</span>
      </div>
      <div id="btn-group">
        <button id="exitBtn" aria-label="Exit">✕</button>
      </div>
    </div>

    <!-- WebRTC Peer Connection Panel -->
    <div id="connection-bar">
      <div>ID: <span id="peer-id-display">Connecting...</span></div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="text" id="call-input" placeholder="Caller ID">
        <button id="call-btn">Start Call</button>
      </div>
    </div>

    <div id="controls">
      <div class="control-group">
        <div class="label-row"><label>Top Boundary</label> <span class="slider-val"><span id="topVal">0</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="topMinus">-</button>
          <input type="range" id="topSlider" min="0" max="80" value="0">
          <button class="step-btn" id="topPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Bottom Boundary</label> <span class="slider-val"><span id="bottomVal">0</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="bottomMinus">-</button>
          <input type="range" id="bottomSlider" min="0" max="80" value="0">
          <button class="step-btn" id="bottomPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Left Boundary</label> <span class="slider-val"><span id="leftVal">0</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="leftMinus">-</button>
          <input type="range" id="leftSlider" min="0" max="45" value="0">
          <button class="step-btn" id="leftPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Right Boundary</label> <span class="slider-val"><span id="rightVal">0</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="rightMinus">-</button>
          <input type="range" id="rightSlider" min="0" max="45" value="0">
          <button class="step-btn" id="rightPlus">+</button>
        </div>
      </div>

      <div class="control-group full-width">
        <div class="label-row"><label>Camera Zoom Factor</label> <span class="slider-val"><span id="zoomVal">1.0</span>x</span></div>
        <div class="input-row">
          <button class="step-btn" id="zoomMinus">-</button>
          <input type="range" id="zoomSlider" min="0.5" max="4.0" step="0.05" value="1.0">
          <button class="step-btn" id="zoomPlus">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewfinder-container">
    <div id="aperture-wrapper">
      <div id="center-cross"></div>
      <video id="cameraFeed" autoplay playsinline muted></video>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const apertureWrapper = document.getElementById('aperture-wrapper');

    const topSlider = document.getElementById('topSlider');
    const bottomSlider = document.getElementById('bottomSlider');
    const leftSlider = document.getElementById('leftSlider');
    const rightSlider = document.getElementById('rightSlider');
    const zoomSlider = document.getElementById('zoomSlider');

    const topVal = document.getElementById('topVal');
    const bottomVal = document.getElementById('bottomVal');
    const leftVal = document.getElementById('leftVal');
    const rightVal = document.getElementById('rightVal');
    const zoomVal = document.getElementById('zoomVal');

    const summaryTop = document.getElementById('summaryTop');
    const summaryBottom = document.getElementById('summaryBottom');
    const summaryLeft = document.getElementById('summaryLeft');
    const summaryRight = document.getElementById('summaryRight');
    const summaryZoom = document.getElementById('summaryZoom');

    const exitBtn = document.getElementById('exitBtn');
    const peerIdDisplay = document.getElementById('peer-id-display');
    const callInput = document.getElementById('call-input');
    const callBtn = document.getElementById('call-btn');

    let localStream = null;
    let peer = null;

    const shortId = Math.random().toString(36).substring(2, 6);

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
      .then(stream => {
        localStream = stream;
        video.srcObject = stream;
        initPeerJS();
      })
      .catch(err => alert("Camera error: " + err.message));

    function initPeerJS() {
      peer = new Peer(shortId);

      peer.on('open', id => {
        peerIdDisplay.textContent = id;
      });

      peer.on('call', call => {
        call.answer(localStream);
        call.on('stream', remoteStream => {
          video.srcObject = remoteStream;
          video.muted = false;
        });
      });
    }

    callBtn.addEventListener('click', () => {
      const targetId = callInput.value.trim();
      if (!targetId) return alert("Please enter a Caller ID.");

      const call = peer.call(targetId, localStream);
      call.on('stream', remoteStream => {
        video.srcObject = remoteStream;
        video.muted = false;
      });
    });

    function updateMask() {
      const t = topSlider.value;
      const b = bottomSlider.value;
      const l = leftSlider.value;
      const r = rightSlider.value;

      apertureWrapper.style.clipPath = `inset(${t}% ${r}% ${b}% ${l}%)`;

      topVal.textContent = t; bottomVal.textContent = b;
      leftVal.textContent = l; rightVal.textContent = r;

      summaryTop.textContent = t; summaryBottom.textContent = b;
      summaryLeft.textContent = l; summaryRight.textContent = r;
    }

    function updateZoom() {
      const z = parseFloat(zoomSlider.value).toFixed(2);
      video.style.transform = `scale(${z})`;
      zoomVal.textContent = z;
      summaryZoom.textContent = z;
    }

    function bindStepButtons(minusId, plusId, slider, step, isZoom = false) {
      document.getElementById(minusId).addEventListener('click', () => {
        if (isZoom) {
          slider.value = (parseFloat(slider.value) - step).toFixed(2);
          updateZoom();
        } else {
          slider.value = parseInt(slider.value) - step;
          updateMask();
        }
      });

      document.getElementById(plusId).addEventListener('click', () => {
        if (isZoom) {
          slider.value = (parseFloat(slider.value) + step).toFixed(2);
          updateZoom();
        } else {
          slider.value = parseInt(slider.value) + step;
          updateMask();
        }
      });
    }

    topSlider.addEventListener('input', updateMask);
    bottomSlider.addEventListener('input', updateMask);
    leftSlider.addEventListener('input', updateMask);
    rightSlider.addEventListener('input', updateMask);
    zoomSlider.addEventListener('input', updateZoom);

    bindStepButtons('topMinus', 'topPlus', topSlider, 1);
    bindStepButtons('bottomMinus', 'bottomPlus', bottomSlider, 1);
    bindStepButtons('leftMinus', 'leftPlus', leftSlider, 1);
    bindStepButtons('rightMinus', 'rightPlus', rightSlider, 1);
    bindStepButtons('zoomMinus', 'zoomPlus', zoomSlider, 0.1, true);

    exitBtn.addEventListener('click', () => {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      window.location.href = "about:blank";
    });
  </script>
</body>
</html>
