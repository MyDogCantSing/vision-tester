<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Viewfinder: Locked Window & Scalable Feed</title>

  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* High-Visibility Readout Banner */
    #photo-readout {
      background-color: #ffff00;
      color: #000000;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      border-bottom: 2px solid #ffffff;
      z-index: 300;
    }

    #readout-values { display: flex; gap: 10px; flex-wrap: wrap; }
    #btn-group { display: flex; gap: 6px; align-items: center; }

    #exitBtn {
      background: #ff3b30; color: #ffffff;
      border: none; border-radius: 50%;
      width: 30px; height: 30px;
      font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }

    /* WebRTC Call Connection Bar */
    #connection-bar {
      background-color: #1c1c1e;
      padding: 6px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      font-size: 13px;
    }

    #peer-id-display { color: #30d158; font-weight: bold; }
    #call-input {
      background: #2c2c2e; color: #fff; border: 1px solid #444;
      padding: 4px 8px; border-radius: 6px; width: 110px; text-transform: lowercase;
    }
    #call-btn {
      background: #0a84ff; color: #fff; border: none;
      padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    #top-bar {
      position: relative;
      width: 100%;
      background-color: rgba(0,0,0,0.95);
      z-index: 200;
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
    }

    #controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px 12px;
      padding: 10px 3%;
      width: 100%;
    }

    .control-group { display: flex; flex-direction: column; gap: 2px; }
    .label-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #ccc; }
    .slider-val { color: #0a84ff; font-size: 13px; font-weight: bold; }

    .input-row { display: flex; align-items: center; gap: 6px; }

    .step-btn {
      background-color: #2c2c2e; color: #0a84ff;
      border: 1px solid #444; border-radius: 8px;
      width: 42px; height: 36px; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; flex-shrink: 0;
    }
    .step-btn:active { background-color: #0a84ff; color: #ffffff; }

    input[type=range] { flex: 1; height: 32px; accent-color: #0a84ff; cursor: pointer; }

    /* Viewfinder Container - Takes up remaining screen */
    #viewfinder-container {
      position: relative;
      flex: 1; 
      width: 100%;
      background-color: #000000;
      overflow: hidden;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LOCKED Aperture Window - Fixed size and position for Peggy's vision zone */
    #aperture-window {
      position: absolute;
      bottom: 20px;
      left: 10%;
      width: 80%;
      height: 250px;
      border: 3px solid #ffff00;
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
    }

    /* Video Feed - Scales and Pans Inside the Locked Window */
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="photo-readout">
      <div id="readout-values">
        <span>SCALE: <span id="summaryZoom">1.0</span>x</span>
        <span>X: <span id="summaryPanX">0</span>px</span>
        <span>Y: <span id="summaryPanY">0</span>px</span>
      </div>
      <div id="btn-group">
        <button id="exitBtn" aria-label="Exit">✕</button>
      </div>
    </div>

    <!-- WebRTC Connection Bar -->
    <div id="connection-bar">
      <div>ID: <span id="peer-id-display">Connecting...</span></div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="text" id="call-input" placeholder="Caller ID">
        <button id="call-btn">Start Call</button>
      </div>
    </div>

    <div id="controls">
      <!-- CAMERA CONTROLS (INSIDE LOCKED WINDOW) -->
      <div class="control-group">
        <div class="label-row"><label>Camera Scale (Shrink / Zoom)</label> <span class="slider-val"><span id="zoomVal">1.0</span>x</span></div>
        <div class="input-row">
          <button class="step-btn" id="zoomMinus">-</button>
          <input type="range" id="zoomSlider" min="0.1" max="15.0" step="0.1" value="1.0">
          <button class="step-btn" id="zoomPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Pan Left / Right</label> <span class="slider-val"><span id="panXVal">0</span>px</span></div>
        <div class="input-row">
          <button class="step-btn" id="panXMinus">-</button>
          <input type="range" id="panXSlider" min="-1000" max="1000" step="10" value="0">
          <button class="step-btn" id="panXPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Pan Up / Down</label> <span class="slider-val"><span id="panYVal">0</span>px</span></div>
        <div class="input-row">
          <button class="step-btn" id="panYMinus">-</button>
          <input type="range" id="panYSlider" min="-1000" max="1000" step="10" value="0">
          <button class="step-btn" id="panYPlus">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewfinder-container">
    <div id="aperture-window">
      <video id="cameraFeed" autoplay playsinline muted></video>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById('cameraFeed');

      const zoomSlider = document.getElementById('zoomSlider');
      const panXSlider = document.getElementById('panXSlider');
      const panYSlider = document.getElementById('panYSlider');

      const zoomVal = document.getElementById('zoomVal');
      const panXVal = document.getElementById('panXVal');
      const panYVal = document.getElementById('panYVal');

      const summaryZoom = document.getElementById('summaryZoom');
      const summaryPanX = document.getElementById('summaryPanX');
      const summaryPanY = document.getElementById('summaryPanY');

      const exitBtn = document.getElementById('exitBtn');
      const peerIdDisplay = document.getElementById('peer-id-display');
      const callInput = document.getElementById('call-input');
      const callBtn = document.getElementById('call-btn');

      let localStream = null;
      let peer = null;

      const shortId = Math.random().toString(36).substring(2, 6);

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
        .then(stream => {
          localStream = stream;
          video.srcObject = stream;
          initPeerJS();
        })
        .catch(err => alert("Camera error: " + err.message));

      function initPeerJS() {
        peer = new Peer(shortId);
        peer.on('open', id => peerIdDisplay.textContent = id);
        peer.on('call', call => {
          call.answer(localStream);
          call.on('stream', remoteStream => {
            video.srcObject = remoteStream;
            video.muted = false;
          });
        });
      }

      callBtn.addEventListener('click', () => {
        const targetId = callInput.value.trim();
        if (!targetId) return alert("Please enter a Caller ID.");
        const call = peer.call(targetId, localStream);
        call.on('stream', remoteStream => {
          video.srcObject = remoteStream;
          video.muted = false;
        });
      });

      function updateCameraFeed() {
        const z = parseFloat(zoomSlider.value).toFixed(1);
        const x = panXSlider.value;
        const y = panYSlider.value;

        video.style.transform = `scale(${z}) translate(${x}px, ${y}px)`;

        zoomVal.textContent = z;
        panXVal.textContent = x;
        panYVal.textContent = y;

        summaryZoom.textContent = z;
        summaryPanX.textContent = x;
        summaryPanY.textContent = y;
      }

      function bindStepButtons(minusId, plusId, slider, step, callback) {
        document.getElementById(minusId).addEventListener('click', () => {
          const isFloat = step.toString().includes('.');
          if (isFloat) {
            slider.value = Math.max(parseFloat(slider.min), parseFloat(slider.value) - step).toFixed(1);
          } else {
            slider.value = Math.max(parseInt(slider.min), parseInt(slider.value) - step);
          }
          callback();
        });

        document.getElementById(plusId).addEventListener('click', () => {
          const isFloat = step.toString().includes('.');
          if (isFloat) {
            slider.value = Math.min(parseFloat(slider.max), parseFloat(slider.value) + step).toFixed(1);
          } else {
            slider.value = Math.min(parseInt(slider.max), parseInt(slider.value) + step);
          }
          callback();
        });
      }

      zoomSlider.addEventListener('input', updateCameraFeed);
      panXSlider.addEventListener('input', updateCameraFeed);
      panYSlider.addEventListener('input', updateCameraFeed);

      bindStepButtons('zoomMinus', 'zoomPlus', zoomSlider, 0.1, updateCameraFeed);
      bindStepButtons('panXMinus', 'panXPlus', panXSlider, 10, updateCameraFeed);
      bindStepButtons('panYMinus', 'panYPlus', panYSlider, 10, updateCameraFeed);

      exitBtn.addEventListener('click', () => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        window.location.href = "about:blank";
      });
    });
  </script>
</body>
</html>
