<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Viewfinder: Independent Width & Height Stretch</title>

  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* High-Visibility Readout Banner */
    #photo-readout {
      background-color: #ffff00;
      color: #000000;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      border-bottom: 2px solid #ffffff;
      z-index: 300;
    }

    #readout-values { display: flex; gap: 8px; flex-wrap: wrap; }
    #btn-group { display: flex; gap: 6px; align-items: center; }

    #exitBtn {
      background: #ff3b30; color: #ffffff;
      border: none; border-radius: 50%;
      width: 28px; height: 28px;
      font-size: 15px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }

    /* WebRTC Call Connection Bar */
    #connection-bar {
      background-color: #1c1c1e;
      padding: 4px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      font-size: 12px;
    }

    #peer-id-display { color: #30d158; font-weight: bold; }
    #call-input {
      background: #2c2c2e; color: #fff; border: 1px solid #444;
      padding: 3px 6px; border-radius: 6px; width: 100px; text-transform: lowercase;
    }
    #call-btn {
      background: #0a84ff; color: #fff; border: none;
      padding: 4px 10px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    #top-bar {
      position: relative;
      width: 100%;
      background-color: rgba(0,0,0,0.95);
      z-index: 200;
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
    }

    /* Lock / Unlock Bar */
    #lock-bar {
      background-color: #2c2c2e;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
    }

    #lockBtn {
      background: #ff9f0a; color: #000; border: none;
      padding: 6px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer;
    }
    #lockBtn.locked {
      background: #30d158; color: #000;
    }
    #lock-status-text { font-size: 12px; font-weight: bold; color: #ccc; }

    #controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      padding: 6px 2%;
      width: 100%;
    }

    .control-group { display: flex; flex-direction: column; gap: 1px; }
    .label-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: #ccc; }
    .slider-val { color: #0a84ff; font-size: 11px; font-weight: bold; }

    .input-row { display: flex; align-items: center; gap: 4px; }

    .step-btn {
      background-color: #2c2c2e; color: #0a84ff;
      border: 1px solid #444; border-radius: 6px;
      width: 30px; height: 24px; font-size: 14px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; flex-shrink: 0;
    }
    .step-btn:active { background-color: #0a84ff; color: #ffffff; }

    input[type=range] { flex: 1; height: 22px; accent-color: #0a84ff; cursor: pointer; }

    /* Viewfinder Container */
    #viewfinder-container {
      position: relative;
      flex: 1; 
      width: 100%;
      background-color: #000000;
      overflow: hidden;
      z-index: 10;
    }

    /* Yellow Aperture Window (Peggy's Visible Window) */
    #aperture-window {
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      bottom: 10%;
      border: 4px solid #ffff00;
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
      transition: border-color 0.2s ease;
    }
    #aperture-window.locked {
      border-color: #30d158; /* turns green when locked */
    }

    /* Video Feed - Scales and Pans Inside the Window */
    video {
      width: 100%; height: 100%;
      object-fit: fill; /* allows independent stretching */
      transform-origin: center center;
    }

    .disabled-controls { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="photo-readout">
      <div id="readout-values">
        <span>STATUS: <span id="summaryStatus" style="color: #ff9f0a;">UNLOCKED</span></span>
        <span>W: <span id="summaryZoomX">1.0</span>x</span>
        <span>H: <span id="summaryZoomY">1.0</span>x</span>
        <span>X: <span id="summaryPanX">0</span>px</span>
        <span>Y: <span id="summaryPanY">0</span>px</span>
      </div>
      <div id="btn-group">
        <button id="exitBtn" aria-label="Exit">✕</button>
      </div>
    </div>

    <!-- WebRTC Connection Bar -->
    <div id="connection-bar">
      <div>ID: <span id="peer-id-display">Connecting...</span></div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="text" id="call-input" placeholder="Caller ID">
        <button id="call-btn">Start Call</button>
      </div>
    </div>

    <!-- Lock / Unlock Bar -->
    <div id="lock-bar">
      <span id="lock-status-text">Step 1: Size Peggy's Window, then Lock it.</span>
      <button id="lockBtn">🔓 UNLOCKED (Click to Lock Window)</button>
    </div>

    <div id="controls">
      <!-- WINDOW SIZING CONTROLS (DISABLED WHEN LOCKED) -->
      <div class="control-group window-control">
        <div class="label-row"><label>Window Top Position</label> <span class="slider-val"><span id="topVal">50</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="topMinus">-</button>
          <input type="range" id="topSlider" min="0" max="85" value="50">
          <button class="step-btn" id="topPlus">+</button>
        </div>
      </div>

      <div class="control-group window-control">
        <div class="label-row"><label>Window Bottom Position</label> <span class="slider-val"><span id="bottomVal">10</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="bottomMinus">-</button>
          <input type="range" id="bottomSlider" min="0" max="85" value="10">
          <button class="step-btn" id="bottomPlus">+</button>
        </div>
      </div>

      <div class="control-group window-control">
        <div class="label-row"><label>Window Left Margin</label> <span class="slider-val"><span id="leftVal">10</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="leftMinus">-</button>
          <input type="range" id="leftSlider" min="0" max="40" value="10">
          <button class="step-btn" id="leftPlus">+</button>
        </div>
      </div>

      <div class="control-group window-control">
        <div class="label-row"><label>Window Right Margin</label> <span class="slider-val"><span id="rightVal">10</span>%</span></div>
        <div class="input-row">
          <button class="step-btn" id="leftMinus" style="display:none">-</button> <!-- spacer match -->
          <button class="step-btn" id="rightMinus">-</button>
          <input type="range" id="rightSlider" min="0" max="40" value="10">
          <button class="step-btn" id="rightPlus">+</button>
        </div>
      </div>

      <!-- VIDEO INSIDE WINDOW CONTROLS (ALWAYS ACTIVE) -->
      <div class="control-group">
        <div class="label-row"><label>Video Width Scale</label> <span class="slider-val"><span id="zoomXVal">1.0</span>x</span></div>
        <div class="input-row">
          <button class="step-btn" id="zoomXMinus">-</button>
          <input type="range" id="zoomXSlider" min="0.1" max="10.0" step="0.1" value="1.0">
          <button class="step-btn" id="zoomXPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Video Height Stretch (Top/Btm)</label> <span class="slider-val"><span id="zoomYVal">1.0</span>x</span></div>
        <div class="input-row">
          <button class="step-btn" id="zoomYMinus">-</button>
          <input type="range" id="zoomYSlider" min="0.1" max="10.0" step="0.1" value="1.0">
          <button class="step-btn" id="zoomYPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Video Pan Left / Right</label> <span class="slider-val"><span id="panXVal">0</span>px</span></div>
        <div class="input-row">
          <button class="step-btn" id="panXMinus">-</button>
          <input type="range" id="panXSlider" min="-1000" max="1000" step="10" value="0">
          <button class="step-btn" id="panXPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row"><label>Video Pan Up / Down</label> <span class="slider-val"><span id="panYVal">0</span>px</span></div>
        <div class="input-row">
          <button class="step-btn" id="panYMinus">-</button>
          <input type="range" id="panYSlider" min="-1000" max="1000" step="10" value="0">
          <button class="step-btn" id="panYPlus">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewfinder-container">
    <div id="aperture-window">
      <video id="cameraFeed" autoplay playsinline muted></video>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById('cameraFeed');
      const apertureWindow = document.getElementById('aperture-window');

      const topSlider = document.getElementById('topSlider');
      const bottomSlider = document.getElementById('bottomSlider');
      const leftSlider = document.getElementById('leftSlider');
      const rightSlider = document.getElementById('rightSlider');
      
      const zoomXSlider = document.getElementById('zoomXSlider');
      const zoomYSlider = document.getElementById('zoomYSlider');
      const panXSlider = document.getElementById('panXSlider');
      const panYSlider = document.getElementById('panYSlider');

      const topVal = document.getElementById('topVal');
      const bottomVal = document.getElementById('bottomVal');
      const leftVal = document.getElementById('leftVal');
      const rightVal = document.getElementById('rightVal');
      
      const zoomXVal = document.getElementById('zoomXVal');
      const zoomYVal = document.getElementById('zoomYVal');
      const panXVal = document.getElementById('panXVal');
      const panYVal = document.getElementById('panYVal');

      const summaryStatus = document.getElementById('summaryStatus');
      const summaryZoomX = document.getElementById('summaryZoomX');
      const summaryZoomY = document.getElementById('summaryZoomY');
      const summaryPanX = document.getElementById('summaryPanX');
      const summaryPanY = document.getElementById('summaryPanY');

      const lockBtn = document.getElementById('lockBtn');
      const lockStatusText = document.getElementById('lock-status-text');
      const windowControls = document.querySelectorAll('.window-control');

      const exitBtn = document.getElementById('exitBtn');
      const peerIdDisplay = document.getElementById('peer-id-display');
      const callInput = document.getElementById('call-input');
      const callBtn = document.getElementById('call-btn');

      let isLocked = false;
      let localStream = null;
      let peer = null;

      const shortId = Math.random().toString(36).substring(2, 6);

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
        .then(stream => {
          localStream = stream;
          video.srcObject = stream;
          initPeerJS();
        })
        .catch(err => alert("Camera error: " + err.message));

      function initPeerJS() {
        peer = new Peer(shortId);
        peer.on('open', id => peerIdDisplay.textContent = id);
        peer.on('call', call => {
          call.answer(localStream);
          call.on('stream', remoteStream => {
            video.srcObject = remoteStream;
            video.muted = false;
          });
        });
      }

      callBtn.addEventListener('click', () => {
        const targetId = callInput.value.trim();
        if (!targetId) return alert("Please enter a Caller ID.");
        const call = peer.call(targetId, localStream);
        call.on('stream', remoteStream => {
          video.srcObject = remoteStream;
          video.muted = false;
        });
      });

      // Lock / Unlock Window Toggle
      lockBtn.addEventListener('click', () => {
        isLocked = !isLocked;
        if (isLocked) {
          lockBtn.textContent = "🔒 LOCKED (Click to Unlock Window)";
          lockBtn.classList.add('locked');
          apertureWindow.classList.add('locked');
          summaryStatus.textContent = "LOCKED";
          summaryStatus.style.color = "#30d158";
          lockStatusText.textContent = "Window is locked. Adjust Width & Height stretch inside.";
          windowControls.forEach(el => el.classList.add('disabled-controls'));
        } else {
          lockBtn.textContent = "🔓 UNLOCKED (Click to Lock Window)";
          lockBtn.classList.remove('locked');
          apertureWindow.classList.remove('locked');
          summaryStatus.textContent = "UNLOCKED";
          summaryStatus.style.color = "#ff9f0a";
          lockStatusText.textContent = "Step 1: Size Peggy's Window, then Lock it.";
          windowControls.forEach(el => el.classList.remove('disabled-controls'));
        }
      });

      function updateWindowBounds() {
        if (isLocked) return;
        const t = topSlider.value;
        const b = bottomSlider.value;
        const l = leftSlider.value;
        const r = rightSlider.value;

        apertureWindow.style.top = t + '%';
        apertureWindow.style.bottom = b + '%';
        apertureWindow.style.left = l + '%';
        apertureWindow.style.right = r + '%';

        topVal.textContent = t; bottomVal.textContent = b;
        leftVal.textContent = l; rightVal.textContent = r;
      }

      function updateCameraFeed() {
        const zx = parseFloat(zoomXSlider.value).toFixed(1);
        const zy = parseFloat(zoomYSlider.value).toFixed(1);
        const x = panXSlider.value;
        const y = panYSlider.value;

        video.style.transform = `scale(${zx}, ${zy}) translate(${x}px, ${y}px)`;

        zoomXVal.textContent = zx;
        zoomYVal.textContent = zy;
        panXVal.textContent = x;
        panYVal.textContent = y;

        summaryZoomX.textContent = zx;
        summaryZoomY.textContent = zy;
        summaryPanX.textContent = x;
        summaryPanY.textContent = y;
      }

      function bindStepButtons(minusId, plusId, slider, step, callback) {
        document.getElementById(minusId).addEventListener('click', () => {
          if (slider.id.includes('top') || slider.id.includes('bottom') || slider.id.includes('left') || slider.id.includes('right')) {
            if (isLocked) return;
          }
          const isFloat = step.toString().includes('.');
          if (isFloat) {
            slider.value = Math.max(parseFloat(slider.min), parseFloat(slider.value) - step).toFixed(1);
          } else {
            slider.value = Math.max(parseInt(slider.min), parseInt(slider.value) - step);
          }
          callback();
        });

        document.getElementById(plusId).addEventListener('click', () => {
          if (slider.id.includes('top') || slider.id.includes('bottom') || slider.id.includes('left') || slider.id.includes('right')) {
            if (isLocked) return;
          }
          const isFloat = step.toString().includes('.');
          if (isFloat) {
            slider.value = Math.min(parseFloat(slider.max), parseFloat(slider.value) + step).toFixed(1);
          } else {
            slider.value = Math.min(parseInt(slider.max), parseInt(slider.value) + step);
          }
          callback();
        });
      }

      topSlider.addEventListener('input', updateWindowBounds);
      bottomSlider.addEventListener('input', updateWindowBounds);
      leftSlider.addEventListener('input', updateWindowBounds);
      rightSlider.addEventListener('input', updateWindowBounds);

      zoomXSlider.addEventListener('input', updateCameraFeed);
      zoomYSlider.addEventListener('input', updateCameraFeed);
      panXSlider.addEventListener('input', updateCameraFeed);
      panYSlider.addEventListener('input', updateCameraFeed);

      bindStepButtons('topMinus', 'topPlus', topSlider, 1, updateWindowBounds);
      bindStepButtons('bottomMinus', 'bottomPlus', bottomSlider, 1, updateWindowBounds);
      bindStepButtons('leftMinus', 'leftPlus', leftSlider, 1, updateWindowBounds);
      bindStepButtons('rightMinus', 'rightPlus', rightSlider, 1, updateWindowBounds);

      bindStepButtons('zoomXMinus', 'zoomXPlus', zoomXSlider, 0.1, updateCameraFeed);
      bindStepButtons('zoomYMinus', 'zoomYPlus', zoomYSlider, 0.1, updateCameraFeed);
      bindStepButtons('panXMinus', 'panXPlus', panXSlider, 10, updateCameraFeed);
      bindStepButtons('panYMinus', 'panYPlus', panYSlider, 10, updateCameraFeed);

      exitBtn.addEventListener('click', () => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        window.location.href = "about:blank";
      });
    });
  </script>
</body>
</html>
